<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Light Dark TCG - A Batalha Começou</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&family=Cinzel:wght@400;600;700;900&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0a0a0c;
        color: #e2e8f0;
      }
      img, video {
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -o-user-select: none;
        user-select: none;
        -webkit-user-drag: none;
        -khtml-user-drag: none;
        -moz-user-drag: none;
        -o-user-drag: none;
      }
      .font-mono {
        font-family: 'JetBrains Mono', monospace;
      }
      .perspective-1000 {
        perspective: 1000px;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      @keyframes flicker {
        0%, 19.999%, 22%, 62.999%, 64%, 64.999%, 70%, 100% {
          opacity: 1;
        }
        20%, 21.999%, 63%, 63.999%, 65%, 69.999% {
          opacity: 0.4;
        }
      }
      @keyframes flicker-rare {
        0%, 90% {
          opacity: 0;
        }
        90.1%, 92%, 94.1%, 96%, 98.1%, 100% {
          opacity: 1;
        }
        92.1%, 94%, 96.1%, 98% {
          opacity: 0.2;
        }
      }
      .animate-flicker {
        animation: flicker 5s infinite;
      }
      .animate-flicker-rare {
        animation: flicker-rare 10s infinite;
      }
      
      .glitch-text {
        position: relative;
        animation: flicker 5s infinite;
      }
      
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: transparent;
      }
      
      .glitch-text::before {
        left: 2px;
        text-shadow: -2px 0 #ff00c1;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      
      .glitch-text::after {
        left: -2px;
        text-shadow: -2px 0 #00fff9, 2px 2px #ff00c1;
        animation: glitch-anim2 1s infinite linear alternate-reverse;
      }
      
      @keyframes glitch-anim {
        0% { clip: rect(11px, 9999px, 75px, 0); }
        5% { clip: rect(85px, 9999px, 59px, 0); }
        10% { clip: rect(66px, 9999px, 94px, 0); }
        15% { clip: rect(44px, 9999px, 49px, 0); }
        20% { clip: rect(17px, 9999px, 54px, 0); }
        25% { clip: rect(65px, 9999px, 2px, 0); }
        30% { clip: rect(98px, 9999px, 34px, 0); }
        35% { clip: rect(21px, 9999px, 86px, 0); }
        40% { clip: rect(48px, 9999px, 12px, 0); }
        45% { clip: rect(74px, 9999px, 68px, 0); }
        50% { clip: rect(3px, 9999px, 91px, 0); }
        55% { clip: rect(59px, 9999px, 27px, 0); }
        60% { clip: rect(82px, 9999px, 45px, 0); }
        65% { clip: rect(14px, 9999px, 79px, 0); }
        70% { clip: rect(96px, 9999px, 5px, 0); }
        75% { clip: rect(37px, 9999px, 62px, 0); }
        80% { clip: rect(52px, 9999px, 23px, 0); }
        85% { clip: rect(89px, 9999px, 88px, 0); }
        90% { clip: rect(8px, 9999px, 41px, 0); }
        95% { clip: rect(61px, 9999px, 76px, 0); }
        100% { clip: rect(29px, 9999px, 19px, 0); }
      }
      
      @keyframes glitch-anim2 {
        0% { clip: rect(65px, 9999px, 100px, 0); }
        5% { clip: rect(52px, 9999px, 74px, 0); }
        10% { clip: rect(79px, 9999px, 85px, 0); }
        15% { clip: rect(75px, 9999px, 5px, 0); }
        20% { clip: rect(67px, 9999px, 61px, 0); }
        25% { clip: rect(14px, 9999px, 79px, 0); }
        30% { clip: rect(1px, 9999px, 66px, 0); }
        35% { clip: rect(86px, 9999px, 30px, 0); }
        40% { clip: rect(23px, 9999px, 98px, 0); }
        45% { clip: rect(85px, 9999px, 72px, 0); }
        50% { clip: rect(71px, 9999px, 75px, 0); }
        55% { clip: rect(2px, 9999px, 48px, 0); }
        60% { clip: rect(30px, 9999px, 16px, 0); }
        65% { clip: rect(59px, 9999px, 50px, 0); }
        70% { clip: rect(41px, 9999px, 62px, 0); }
        75% { clip: rect(2px, 9999px, 82px, 0); }
        80% { clip: rect(47px, 9999px, 73px, 0); }
        85% { clip: rect(3px, 9999px, 27px, 0); }
        90% { clip: rect(26px, 9999px, 55px, 0); }
        95% { clip: rect(42px, 9999px, 97px, 0); }
        100% { clip: rect(38px, 9999px, 49px, 0); }
      }
    </style>
